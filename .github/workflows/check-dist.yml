# In TypeScript actions, `dist/` is a special directory. When you reference
# an action with the `uses:` property, files under `dist/` are the code that
# will be run. This workflow ensures the complete `dist/` directory contains
# the expected transpiled code and source maps.
#
# If this workflow is run from a feature branch, it will act as an additional CI
# check and fail if the checked-in `dist/` directory does not match what is
# expected from the build.
name: Check Transpiled JavaScript

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-dist:
    name: Check dist/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Workspace Packages
        run: |
          npm run clean:packages
          npm run build:packages

      - name: Build dist/ Directory
        run: |
          rm -Rf dist
          npm run build

      # This will fail the workflow if the `dist/` directory is different than
      # expected.
      - name: Compare dist/ Directories
        id: diff
        run: |
          if [ ! -d dist/ ]; then
            echo "Expected dist/ directory does not exist.  See status below:"
            ls -la ./
            exit 1
          fi
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "Detected uncommitted changes after build. See status below:"
            git status --short -- dist/
            git diff --ignore-space-at-eol --text -- dist/
            exit 1
          fi

      # If `dist/` was different than expected, upload the expected version as a
      # workflow artifact.
      - if: ${{ failure() && steps.diff.outcome == 'failure' }}
        name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
