name: Upload Packages

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  upload-packages:
    name: Upload Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nerdbank.GitVersioning needs full git history to compute commit-height.
          fetch-depth: 0

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Clean outputs
        run: npm run clean:packages

      - name: Stamp versions
        run: npm run stamp-version --workspace @azure/bicep-rpc-client --workspace @azure/bicep-deploy-common

      - name: Build packages
        run: npm run build:packages

      - name: Create and validate package tarballs
        id: pack-packages
        run: |
          packOutput=$(npm run pack:validate --workspace @azure/bicep-deploy-common --silent)
          echo "rpc-filename=$(echo "$packOutput" | jq -r '.rpc.filename')" >> $GITHUB_OUTPUT
          echo "rpc-version=$(echo "$packOutput" | jq -r '.rpc.version')" >> $GITHUB_OUTPUT
          echo "common-filename=$(echo "$packOutput" | jq -r '.common.filename')" >> $GITHUB_OUTPUT
          echo "common-version=$(echo "$packOutput" | jq -r '.common.version')" >> $GITHUB_OUTPUT

      - name: Reset versions
        if: always()
        run: npm run reset-version --workspace @azure/bicep-rpc-client --workspace @azure/bicep-deploy-common

      # Using upload steps defined for the Partner Release Pipeline (https://aka.ms/azsdk/partner-release-pipeline)
      # azuresdkpartnerdrops is the managed identity that we use to upload to the partner drop folder
      - name: Login to azuresdkpartnerdrops
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURESDKPARTNERDROPS_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURESDKPARTNERDROPS_TENANT_ID }}
          subscription-id: ${{ secrets.AZURESDKPARTNERDROPS_SUBSCRIPTION_ID }}

      # Upload packages to partner drop folder to allow external distribution under the @azure scope
      - name: Upload packages to partner drop folder
        run: |
          echo "Uploading ${{ steps.pack-packages.outputs.rpc-filename }} to partner drop folder at drops/bicep-rpc-client/npm/${{ steps.pack-packages.outputs.rpc-version }}..."
          az storage blob upload -f "${{ steps.pack-packages.outputs.rpc-filename }}" -c "drops/bicep-rpc-client/npm/${{ steps.pack-packages.outputs.rpc-version }}" --account-name azuresdkpartnerdrops --auth-mode login
          echo "Uploading ${{ steps.pack-packages.outputs.common-filename }} to partner drop folder at drops/bicep-deploy-common/npm/${{ steps.pack-packages.outputs.common-version }}..."
          az storage blob upload -f "${{ steps.pack-packages.outputs.common-filename }}" -c "drops/bicep-deploy-common/npm/${{ steps.pack-packages.outputs.common-version }}" --account-name azuresdkpartnerdrops --auth-mode login